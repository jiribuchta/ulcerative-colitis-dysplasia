# @package _global_

defaults:
  - /ml/train/base
  - /ml/data/embeddings_datamodule
  - _self_

datamodule:
  batch_size: 512
  num_workers: 8

  train:
    uris:
      - ${dataset.mlflow_uris.embeddings.train}
    val_fold: ${val_fold}

  val:
    uris:
      - ${dataset.mlflow_uris.embeddings.train}
    is_val: true
    val_fold: ${val_fold}
